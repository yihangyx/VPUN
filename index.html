<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN 自动注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0F0F12;
            --bg-grad-1: #1a1a2e;
            --bg-grad-2: #0F0F12;
            --card: #1C1C22;
            --card-hover: #24242c;
            --inner: #141419;
            --border: rgba(255,255,255,0.06);
            --text: #F2F2F7;
            --text-dim: #8E8E93;
            --accent: #BF5AF2;
            --accent-hover: #A254D6;
            --blue: #0A84FF;
            --blue-hover: #0071E3;
            --green: #30D158;
            --red: #FF453A;
            --orange: #FF9F0A;
            --cyan: #64D2FF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(ellipse at top, var(--bg-grad-1) 0%, var(--bg-grad-2) 60%) fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 40px 16px 60px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown 0.6s ease;
        }
        .header .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #FF2D55 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(191, 90, 242, 0.35);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .header p {
            color: var(--text-dim);
            font-size: 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            animation: fadeUp 0.5s ease backwards;
        }
        .card:nth-child(2) { animation-delay: 0.05s; }
        .card:nth-child(3) { animation-delay: 0.1s; }
        .card:nth-child(4) { animation-delay: 0.15s; }
        .card:nth-child(5) { animation-delay: 0.2s; }
        .card:nth-child(6) { animation-delay: 0.25s; }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text);
        }
        .btn {
            background: linear-gradient(135deg, var(--accent) 0%, #A254D6 100%);
            color: white;
            border: none;
            padding: 15px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(191, 90, 242, 0.3);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(191, 90, 242, 0.45);
        }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled {
            background: #3a3a3e;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn.secondary {
            background: linear-gradient(135deg, var(--blue) 0%, #0071E3 100%);
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.3);
        }
        .btn.secondary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.45);
        }
        .email-box {
            background: var(--inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 14px;
            color: var(--cyan);
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .copy-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.15); }
        .copy-btn.copied {
            background: rgba(48, 209, 88, 0.2);
            color: var(--green);
            border-color: rgba(48, 209, 88, 0.4);
        }
        .code-box {
            background: var(--inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 38px;
            font-weight: 700;
            color: var(--green);
            text-align: center;
            letter-spacing: 10px;
        }
        .log {
            background: var(--inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.8;
        }
        .log::-webkit-scrollbar { width: 6px; }
        .log::-webkit-scrollbar-thumb { background: #48484A; border-radius: 3px; }
        .log .ok { color: var(--green); }
        .log .err { color: var(--red); }
        .log .info { color: var(--text-dim); }
        .log .run { color: var(--blue); }
        .log .warn { color: var(--orange); }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.ready { background: rgba(48, 209, 88, 0.18); color: var(--green); }
        .status-badge.running { background: rgba(255, 159, 10, 0.18); color: var(--orange); }
        .status-badge.error { background: rgba(255, 69, 58, 0.18); color: var(--red); }
        .email-item {
            padding: 12px;
            background: var(--inner);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .email-item:hover { background: var(--card-hover); }
        .email-subject {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .email-from {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .email-body {
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            color: #c7c7cc;
        }
        .email-detail {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        /* 注册成功结果卡片 */
        .result-card {
            background: linear-gradient(135deg, rgba(48, 209, 88, 0.12) 0%, rgba(48, 209, 88, 0.03) 100%);
            border: 1px solid rgba(48, 209, 88, 0.35);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 14px;
            box-shadow: 0 4px 24px rgba(48, 209, 88, 0.15);
            display: none;
            animation: fadeUp 0.5s ease;
        }
        .result-card.show { display: block; }
        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .result-header .check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--green);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }
        .result-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: var(--green);
        }
        .result-row {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .result-row .label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .result-row .value {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 14px;
            color: var(--text);
            word-break: break-all;
        }
        .result-row .value.password { color: var(--orange); }
        .result-row-left { flex: 1; min-width: 0; }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(40, 40, 45, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"></div>
            <h1> 自动注册</h1>
            <p>基于 temppin.com 临时邮箱，一键完成注册</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>⚡ 操作</span>
                <span class="status-badge ready" id="status">就绪</span>
            </div>
            <button class="btn" id="btn-start" onclick="startFullFlow()">
                一键自动注册
            </button>
            <div style="height: 10px;"></div>
            <button class="btn secondary" onclick="createNewEmail()">
                换一个邮箱
            </button>
        </div>

        <!-- 注册成功结果卡片（默认隐藏） -->
        <div class="result-card" id="result-card">
            <div class="result-header">
                <div class="check">✓</div>
                <h2>注册成功！账号信息</h2>
            </div>
            <div class="result-row">
                <div class="result-row-left">
                    <div class="label">📧 邮箱</div>
                    <div class="value" id="result-email">--</div>
                </div>
                <button class="copy-btn" onclick="copyResult('email', this)">复制邮箱</button>
            </div>
            <div class="result-row">
                <div class="result-row-left">
                    <div class="label">🔑 密码</div>
                    <div class="value password" id="result-password">--</div>
                </div>
                <button class="copy-btn" onclick="copyResult('password', this)">复制密码</button>
            </div>
            <div class="result-row">
                <div class="result-row-left">
                    <div class="label">⏱️ 免费时长</div>
                    <div class="value" id="result-duration">--</div>
                </div>
                <button class="copy-btn" onclick="copyResult('duration', this)">复制时长</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📧 临时邮箱</div>
            <div class="email-box">
                <span id="email">点击下方按钮创建</span>
                <button class="copy-btn" onclick="copyEmail()">复制</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>📥 收件箱</span>
                <span id="email-count" style="font-size:12px;color:var(--text-dim);">0 封邮件</span>
            </div>
            <div id="emails">
                <div style="color:var(--text-dim);text-align:center;padding:20px;font-size:13px;">
                    暂无邮件
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔢 验证码</div>
            <div class="code-box" id="code">------</div>
        </div>

        <div class="card">
            <div class="card-title">📋 运行日志</div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        let state = {
            email: '',
            token: '',
            imei: '',
            deviceToken: '',
            running: false,
            pollTimer: null,
            currentMails: [],
            openedMailId: null,
            code: '',
            // 注册成功后保存的结果
            result: {
                email: '',
                password: '',
                duration: ''
            }
        };

        function log(msg, type = 'info') {
            const t = new Date().toLocaleTimeString();
            document.getElementById('log').innerHTML +=
                '<div class="' + type + '">[' + t + '] ' + msg + '</div>';
            const logEl = document.getElementById('log');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, type = 'ready') {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status-badge ' + type;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        // 创建新邮箱
        async function createNewEmail() {
            try {
                log('📧 创建新邮箱...', 'run');

                const r = await fetch('/api/temppin/create');
                const data = await r.json();

                if (data.error) throw new Error(data.error);

                const mailbox = data.mailbox;
                state.email = mailbox.address;
                state.token = mailbox.token;
                state.currentMails = [];
                state.openedMailId = null;

                document.getElementById('email').textContent = mailbox.address;
                document.getElementById('code').textContent = '------';

                log('✅ 邮箱创建成功: ' + mailbox.address, 'ok');

                startPolling();
                refreshInbox();

                return mailbox;
            } catch (e) {
                log('❌ 创建邮箱失败: ' + e.message, 'err');
                throw e;
            }
        }

        function copyEmail() {
            if (!state.email) return;
            navigator.clipboard.writeText(state.email);
            showToast('邮箱已复制');
            log('📋 已复制邮箱到剪贴板', 'info');
        }

        // 注册成功结果卡片的复制
        function copyResult(field, btn) {
            const text = state.result[field];
            if (!text) return;
            navigator.clipboard.writeText(text);
            showToast('已复制' + (field === 'email' ? '邮箱' : field === 'password' ? '密码' : '时长'));
            if (btn) {
                const orig = btn.textContent;
                btn.classList.add('copied');
                btn.textContent = '✓ 已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = orig;
                }, 1500);
            }
        }

        function startPolling() {
            if (state.pollTimer) clearInterval(state.pollTimer);
            state.pollTimer = setInterval(refreshInbox, 3000);
        }

        async function refreshInbox() {
            if (!state.token) return;

            try {
                const r = await fetch('/api/temppin/inbox?token=' + state.token);
                const data = await r.json();

                if (data.error) return;

                const emails = data.emails || [];
                state.currentMails = emails;
                displayEmails(emails);
            } catch (e) {
                console.log('刷新失败:', e);
            }
        }

        function displayEmails(emails) {
            const container = document.getElementById('emails');
            const countEl = document.getElementById('email-count');

            countEl.textContent = emails.length + ' 封邮件';

            if (emails.length === 0) {
                container.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:13px;">暂无邮件</div>';
                return;
            }

            let html = '';
            let foundCode = null;

            emails.forEach(mail => {
                const fromName = mail.from_name || '';
                const fromAddr = mail.from_address || '';
                const from = (fromName ? fromName + ' ' : '') + (fromAddr ? '<' + fromAddr + '>' : '');
                const subject = mail.subject || '(无主题)';
                const isOpen = state.openedMailId === mail.id;

                html += '<div class="email-item" onclick="toggleMail(' + mail.id + ')">';
                html += '<div class="email-subject">' + escapeHtml(subject) + '</div>';
                html += '<div class="email-from">来自: ' + escapeHtml(from) + '</div>';

                if (isOpen) {
                    html += '<div class="email-detail" id="detail-' + mail.id + '">加载中...</div>';
                }

                html += '</div>';

                // 从主题提取验证码
                let match = subject.match(/(?:code|verification|验证码)[^\d]*(\d{4,6})/i);
                if (!match) match = subject.match(/\b(\d{4,6})\b/);
                if (match && !foundCode) {
                    foundCode = match[1];
                }
            });

            container.innerHTML = html;

            if (foundCode && foundCode !== state.code) {
                state.code = foundCode;
                document.getElementById('code').textContent = foundCode;
                log('🔢 收到验证码: ' + foundCode, 'ok');
            }
        }

        async function toggleMail(mailId) {
            if (state.openedMailId === mailId) {
                state.openedMailId = null;
                displayEmails(state.currentMails);
                return;
            }

            state.openedMailId = mailId;
            displayEmails(state.currentMails);

            try {
                const r = await fetch('/api/temppin/email/' + mailId + '?token=' + state.token);
                const detail = await r.json();

                const detailEl = document.getElementById('detail-' + mailId);
                if (detailEl) {
                    const bodyText = detail.text_body || detail.bodyText || detail.body_text || '';
                    const bodyHtml = detail.html_body || detail.bodyHtml || detail.body_html || '';

                    let content = '';
                    if (bodyText) {
                        content = '<div class="email-body">' + escapeHtml(bodyText) + '</div>';
                    } else if (bodyHtml) {
                        content = '<div class="email-body">' + bodyHtml + '</div>';
                    } else {
                        content = '<div class="email-body" style="color:var(--text-dim);">无正文内容</div>';
                    }

                    detailEl.innerHTML = content;

                    let match = bodyText.match(/\b(\d{4,6})\b/);
                    if (!match) match = bodyHtml.match(/\b(\d{4,6})\b/);
                    if (match && !state.code) {
                        state.code = match[1];
                        document.getElementById('code').textContent = state.code;
                        log('🔢 从正文提取验证码: ' + state.code, 'ok');
                    }
                }
            } catch (e) {
                const detailEl = document.getElementById('detail-' + mailId);
                if (detailEl) detailEl.textContent = '加载失败: ' + e.message;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function vpnApi(path, method = 'GET', body = null, token = null, imei = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['j-token'] = token;
            if (imei) headers['imei'] = imei;

            const r = await fetch('/api/vpn/' + path, {
                method: method,
                headers: headers,
                body: body ? JSON.stringify(body) : undefined,
            });
            return await r.json();
        }

        function generateUUID() {
            return '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
            }) + '}';
        }

        async function startFullFlow() {
            if (state.running) return;
            state.running = true;

            document.getElementById('btn-start').disabled = true;
            setStatus('运行中', 'running');

            try {
                log('════════════════════════', 'info');
                log('🚀 开始自动注册流程', 'run');

                if (!state.email) {
                    log('\n📌 Step 1: 创建临时邮箱', 'run');
                    await createNewEmail();
                } else {
                    log('\n📌 Step 1: 使用已有邮箱', 'run');
                    log('   ' + state.email, 'info');
                }

                log('\n📌 Step 2: 初始化设备', 'run');
                state.imei = generateUUID();
                log('   IMEI: ' + state.imei, 'info');

                const initRes = await vpnApi('device/init', 'GET', null, null, state.imei);
                if (initRes.code !== 200) {
                    throw new Error('device/init 失败: ' + JSON.stringify(initRes));
                }
                state.deviceToken = initRes.data.user_info.token;
                log('   ✅ 设备初始化成功', 'ok');

                log('\n📌 Step 3: 发送验证码', 'run');
                const sendRes = await vpnApi(
                    'user/send_email_code',
                    'POST',
                    { email: state.email, type: 10 },
                    state.deviceToken,
                    state.imei
                );

                if (sendRes.code !== 200) {
                    throw new Error('发送验证码失败: ' + sendRes.message);
                }
                log('   ✅ 验证码已发送', 'ok');

                log('\n📌 Step 4: 等待接收验证码', 'run');
                state.code = '';
                document.getElementById('code').textContent = '------';

                let waited = 0;
                while (!state.code && waited < 120) {
                    await new Promise(r => setTimeout(r, 1000));
                    waited++;
                    if (waited % 15 === 0) {
                        log('   ⏳ 已等待 ' + waited + ' 秒...', 'info');
                    }
                }

                if (!state.code) {
                    throw new Error('等待验证码超时（120秒）');
                }

                log('\n📌 Step 5: 完成注册', 'run');

                const pwdRaw = Math.random().toString(36).slice(-8) +
                               Math.random().toString(36).slice(-8);
                const pwdMd5 = CryptoJS.MD5(pwdRaw).toString();

                log('   随机密码: ' + pwdRaw, 'info');

                const signupRes = await vpnApi(
                    'user/signup',
                    'POST',
                    {
                        email: state.email,
                        password: pwdMd5,
                        repassword: pwdMd5,
                        code: state.code,
                    },
                    state.deviceToken,
                    state.imei
                );

                if (signupRes.code !== 200) {
                    throw new Error('注册失败: ' + signupRes.message);
                }

                const free = signupRes.data.user_info.free_remaining_time;
                const hours = Math.floor(free / 3600);
                const mins = Math.floor((free % 3600) / 60);
                const durationText = hours + '小时' + mins + '分';

                log('\n════════════════════════', 'ok');
                log('🎉 注册成功！', 'ok');
                log('   邮箱: ' + state.email, 'ok');
                log('   密码: ' + pwdRaw, 'warn');
                log('   免费时长: ' + durationText, 'ok');
                log('════════════════════════', 'ok');

                // 填充结果卡片并显示
                state.result.email = state.email;
                state.result.password = pwdRaw;
                state.result.duration = durationText;
                document.getElementById('result-email').textContent = state.email;
                document.getElementById('result-password').textContent = pwdRaw;
                document.getElementById('result-duration').textContent = durationText;
                document.getElementById('result-card').classList.add('show');

                setStatus('注册成功', 'ready');

            } catch (e) {
                log('\n❌ 错误: ' + e.message, 'err');
                setStatus('失败', 'error');
            } finally {
                state.running = false;
                document.getElementById('btn-start').disabled = false;
            }
        }

        window.onload = function() {
            log('👋 欢迎使用 JumperVPN 自动注册工具', 'info');
            log('正在自动创建邮箱...', 'info');
            createNewEmail();
        };
    </script>
</body>
</html>
