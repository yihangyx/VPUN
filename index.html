<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumperVPN 自动注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1C1C1E;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            color: #8E8E93;
            font-size: 15px;
        }
        .card {
            background: #2C2C2E;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            background: #BF5AF2;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { background: #A254D6; }
        .btn:disabled {
            background: #48484A;
            cursor: not-allowed;
        }
        .btn.secondary {
            background: #0A84FF;
        }
        .btn.secondary:hover { background: #0071E3; }
        .email-box {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 15px;
            color: #64D2FF;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .copy-btn {
            background: #48484A;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }
        .copy-btn:hover { background: #5a5a5e; }
        .code-box {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            font-size: 36px;
            font-weight: 700;
            color: #30D158;
            text-align: center;
            letter-spacing: 8px;
        }
        .log {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.8;
        }
        .log .ok { color: #30D158; }
        .log .err { color: #FF453A; }
        .log .info { color: #8E8E93; }
        .log .run { color: #0A84FF; }
        .log .warn { color: #FF9F0A; }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .btn { flex: 1; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.ready { background: #30D158; color: #000; }
        .status-badge.running { background: #FF9F0A; color: #000; }
        .status-badge.error { background: #FF453A; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JumperVPN 自动注册</h1>
            <p>基于 temp-mail.io 临时邮箱，一键完成注册</p>
        </div>

        <div class="card">
            <div class="card-title">
                🚀 操作
                <span class="status-badge ready" id="status">就绪</span>
            </div>
            <button class="btn" id="btn-start" onclick="startFullFlow()">
                一键自动注册
            </button>
            <div style="height: 10px;"></div>
            <button class="btn secondary" onclick="createNewEmail()">
                新建邮箱
            </button>
        </div>

        <div class="card">
            <div class="card-title">📧 临时邮箱</div>
            <div class="email-box">
                <span id="email">点击下方按钮创建</span>
                <button class="copy-btn" onclick="copyEmail()">复制</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔢 验证码</div>
            <div class="code-box" id="code">------</div>
        </div>

        <div class="card">
            <div class="card-title">📋 运行日志</div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        let state = {
            email: '',
            tempToken: '',
            imei: '',
            deviceToken: '',
            running: false,
        };

        function log(msg, type = 'info') {
            const t = new Date().toLocaleTimeString();
            document.getElementById('log').innerHTML +=
                '<div class="' + type + '">[' + t + '] ' + msg + '</div>';
            const logEl = document.getElementById('log');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, type = 'ready') {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status-badge ' + type;
        }

        // 创建新邮箱
        async function createNewEmail() {
            try {
                log('📧 创建新邮箱...', 'run');
                const r = await fetch('/api/tempmail/new');
                const data = await r.json();
                
                state.email = data.email;
                state.tempToken = data.token;
                
                document.getElementById('email').textContent = data.email;
                document.getElementById('code').textContent = '------';
                
                log('✅ 邮箱创建成功: ' + data.email, 'ok');
                return data;
            } catch (e) {
                log('❌ 创建邮箱失败: ' + e.message, 'err');
                throw e;
            }
        }

        // 复制邮箱
        function copyEmail() {
            if (!state.email) return;
            navigator.clipboard.writeText(state.email);
            log('📋 已复制到剪贴板', 'info');
        }

        // 获取邮件
        async function getMessages() {
            const r = await fetch('/api/tempmail/messages/' + state.tempToken);
            return await r.json();
        }

        // 从邮件中提取验证码
        function extractCodeFromMessage(msg) {
            // 先从纯文本提取
            const bodyText = msg.body_text || '';
            let match = bodyText.match(/\b(\d{4,6})\b/);
            if (match) return match[1];
            
            // 再从HTML提取
            const bodyHtml = msg.body_html || '';
            match = bodyHtml.match(/\b(\d{4,6})\b/);
            if (match) return match[1];
            
            return null;
        }

        // 调用VPN API
        async function vpnApi(path, method = 'GET', body = null, token = null, imei = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['j-token'] = token;
            if (imei) headers['imei'] = imei;

            const r = await fetch('/api/vpn/' + path, {
                method: method,
                headers: headers,
                body: body ? JSON.stringify(body) : undefined,
            });
            return await r.json();
        }

        // 生成UUID (IMEI)
        function generateUUID() {
            return '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
            }) + '}';
        }

        // 完整注册流程
        async function startFullFlow() {
            if (state.running) return;
            state.running = true;
            
            document.getElementById('btn-start').disabled = true;
            setStatus('运行中', 'running');

            try {
                log('════════════════════════', 'info');
                log('🚀 开始自动注册流程', 'run');

                // Step 1: 创建邮箱
                if (!state.email) {
                    log('\n📌 Step 1: 创建临时邮箱', 'run');
                    await createNewEmail();
                } else {
                    log('\n📌 Step 1: 使用已有邮箱', 'run');
                    log('   ' + state.email, 'info');
                }

                // Step 2: 生成IMEI并初始化设备
                log('\n📌 Step 2: 初始化设备', 'run');
                state.imei = generateUUID();
                log('   IMEI: ' + state.imei, 'info');

                const initRes = await vpnApi('device/init', 'GET', null, null, state.imei);
                if (initRes.code !== 200) {
                    throw new Error('device/init 失败: ' + JSON.stringify(initRes));
                }
                state.deviceToken = initRes.data.user_info.token;
                log('   ✅ 设备初始化成功', 'ok');

                // Step 3: 发送验证码
                log('\n📌 Step 3: 发送验证码', 'run');
                const sendRes = await vpnApi(
                    'user/send_email_code',
                    'POST',
                    { email: state.email, type: 10 },
                    state.deviceToken,
                    state.imei
                );

                if (sendRes.code !== 200) {
                    throw new Error('发送验证码失败: ' + sendRes.message);
                }
                log('   ✅ 验证码已发送', 'ok');

                // Step 4: 等待验证码
                log('\n📌 Step 4: 等待接收验证码', 'run');
                let code = null;
                
                for (let i = 0; i < 40; i++) {
                    await new Promise(r => setTimeout(r, 3000));
                    
                    const messages = await getMessages();
                    if (messages && messages.length > 0) {
                        log(`   📬 收到 ${messages.length} 封邮件`, 'info');
                        
                        for (let msg of messages) {
                            code = extractCodeFromMessage(msg);
                            if (code) {
                                log('   邮件主题: ' + (msg.subject || ''), 'info');
                                break;
                            }
                        }
                        
                        if (code) break;
                    }
                    
                    if (i % 5 === 4) {
                        log(`   ⏳ 已等待 ${(i+1)*3} 秒...`, 'info');
                    }
                }

                if (!code) {
                    throw new Error('等待验证码超时（120秒）');
                }

                state.code = code;
                document.getElementById('code').textContent = code;
                log('   ✅ 验证码: ' + code, 'ok');

                // Step 5: 注册账号
                log('\n📌 Step 5: 完成注册', 'run');
                
                const pwdRaw = Math.random().toString(36).slice(-8) +
                               Math.random().toString(36).slice(-8);
                const pwdMd5 = CryptoJS.MD5(pwdRaw).toString();
                
                log('   生成随机密码: ' + pwdRaw, 'info');

                const signupRes = await vpnApi(
                    'user/signup',
                    'POST',
                    {
                        email: state.email,
                        password: pwdMd5,
                        repassword: pwdMd5,
                        code: code,
                    },
                    state.deviceToken,
                    state.imei
                );

                if (signupRes.code !== 200) {
                    throw new Error('注册失败: ' + signupRes.message);
                }

                const free = signupRes.data.user_info.free_remaining_time;
                const hours = Math.floor(free / 3600);
                const mins = Math.floor((free % 3600) / 60);

                log('\n════════════════════════', 'ok');
                log('🎉 注册成功！', 'ok');
                log('   邮箱: ' + state.email, 'ok');
                log('   密码: ' + pwdRaw, 'warn');
                log(`   免费时长: ${hours}小时${mins}分`, 'ok');
                log('════════════════════════', 'ok');

                setStatus('注册成功', 'ready');

            } catch (e) {
                log('\n❌ 错误: ' + e.message, 'err');
                setStatus('失败', 'error');
            } finally {
                state.running = false;
                document.getElementById('btn-start').disabled = false;
            }
        }

        // 页面加载后自动创建邮箱
        window.onload = function() {
            log('👋 欢迎使用 JumperVPN 自动注册工具', 'info');
            log('点击"一键自动注册"开始', 'info');
        };
    </script>
</body>
</html>
