<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumperVPN 自动注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1C1C1E;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #000;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dots { display: flex; gap: 6px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #FF5F57; }
        .dot.yellow { background: #FEBC2E; }
        .dot.green { background: #28C840; }
        .title { font-size: 14px; font-weight: 600; color: #8E8E93; }
        .status { margin-left: auto; font-size: 13px; color: #30D158; }
        .main { flex: 1; display: flex; overflow: hidden; }
        .sidebar {
            width: 340px;
            background: #2C2C2E;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }
        .content { flex: 1; display: flex; flex-direction: column; }
        .card {
            background: #1C1C1E;
            border-radius: 12px;
            padding: 16px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .btn {
            background: #BF5AF2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn:disabled { background: #48484A; cursor: not-allowed; }
        .btn.blue { background: #0A84FF; }
        .email-box {
            background: #2C2C2E;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #64D2FF;
            word-break: break-all;
        }
        .code-box {
            background: #2C2C2E;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            font-size: 28px;
            font-weight: 700;
            color: #30D158;
            text-align: center;
            letter-spacing: 4px;
        }
        .log {
            background: #2C2C2E;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            max-height: 220px;
            line-height: 1.6;
        }
        .log .ok { color: #30D158; }
        .log .err { color: #FF453A; }
        .log .info { color: #8E8E93; }
        .log .run { color: #0A84FF; }
        .log .warn { color: #FF9F0A; }
        .iframe-container {
            flex: 1;
            background: #fff;
            margin: 16px;
            border-radius: 12px;
            overflow: hidden;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .row { display: flex; gap: 8px; }
        .row .btn { flex: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="title">JumperVPN 自动注册工具</div>
        <div class="status" id="status">● 就绪</div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="card">
                <div class="card-title">🚀 一键注册</div>
                <button class="btn" id="btn-start" onclick="startFullFlow()">开始自动注册</button>
                <div style="height: 8px;"></div>
                <div class="row">
                    <button class="btn blue" onclick="switchDomain()">切换到.shop域名</button>
                    <button class="btn blue" onclick="newEmail()">新建邮箱</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📧 临时邮箱</div>
                <div class="email-box" id="email">等待创建邮箱...</div>
            </div>

            <div class="card">
                <div class="card-title">🔢 验证码</div>
                <div class="code-box" id="code">----</div>
            </div>

            <div class="card">
                <div class="card-title">📋 运行日志</div>
                <div class="log" id="log"></div>
            </div>
        </div>

        <div class="content">
            <div class="iframe-container">
                <iframe id="mailFrame" src="/api/beeinbox/" onload="onFrameLoad()"></iframe>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        let state = {
            email: '',
            code: '',
            imei: '',
            deviceToken: '',
            running: false,
            domainSwitched: false,
        };

        function log(msg, type = 'info') {
            const t = new Date().toLocaleTimeString();
            document.getElementById('log').innerHTML +=
                '<div class="' + type + '">[' + t + '] ' + msg + '</div>';
            document.getElementById('log').scrollTop = 99999;
        }

        function setStatus(msg, color = '#30D158') {
            document.getElementById('status').textContent = '● ' + msg;
            document.getElementById('status').style.color = color;
        }

        // 获取iframe里的Livewire组件
        function getLivewireComponent() {
            try {
                const iframe = document.getElementById('mailFrame');
                const win = iframe.contentWindow;
                if (win.Livewire) {
                    // 找第一个组件
                    const components = win.Livewire.all();
                    for (let comp of components) {
                        if (comp.$wire && comp.$wire.setDomain) {
                            return comp;
                        }
                    }
                }
            } catch (e) {
                console.log('Livewire error:', e);
            }
            return null;
        }

        // 切换域名到beeinbox.shop
        async function switchDomain() {
            log('🔄 切换域名到 beeinbox.shop...', 'run');
            const comp = getLivewireComponent();
            if (comp) {
                try {
                    await comp.$wire.setDomain('beeinbox.shop');
                    log('✅ 域名已切换', 'ok');
                    state.domainSwitched = true;
                    // 等一下然后新建邮箱
                    setTimeout(() => newEmail(), 500);
                } catch (e) {
                    log('❌ 切换失败: ' + e.message, 'err');
                }
            } else {
                log('❌ 找不到Livewire组件', 'err');
            }
        }

        // 新建邮箱
        async function newEmail() {
            log('📧 新建邮箱...', 'run');
            const comp = getLivewireComponent();
            if (comp) {
                try {
                    // 调用deleteEmail来新建
                    await comp.$wire.deleteEmail();
                    log('✅ 已新建邮箱', 'ok');
                } catch (e) {
                    log('❌ 新建失败: ' + e.message, 'err');
                }
            }
        }

        // 从iframe提取邮箱
        function extractEmail() {
            try {
                const iframe = document.getElementById('mailFrame');
                const doc = iframe.contentDocument || iframe.contentWindow.document;

                // 先试试Livewire组件
                const comp = getLivewireComponent();
                if (comp && comp.$wire.email) {
                    const email = comp.$wire.email;
                    if (email && email !== state.email) {
                        state.email = email;
                        document.getElementById('email').textContent = email;
                        log('📧 邮箱: ' + email, 'ok');
                    }
                    return;
                }

                // 备选：从wire:initial-data找
                const els = doc.querySelectorAll('*');
                for (let el of els) {
                    const data = el.getAttribute('wire:initial-data');
                    if (data && data.includes('frontend.actions')) {
                        const parsed = JSON.parse(data);
                        const email = parsed.serverMemo.data.email;
                        if (email && email !== state.email) {
                            state.email = email;
                            document.getElementById('email').textContent = email;
                            log('📧 邮箱: ' + email, 'ok');
                        }
                        return;
                    }
                }
            } catch (e) {}
        }

        // 从iframe提取验证码
        function extractCode() {
            try {
                const iframe = document.getElementById('mailFrame');
                const doc = iframe.contentDocument || iframe.contentWindow.document;

                // 找所有iframe（邮件正文）
                const iframes = doc.querySelectorAll('iframe');
                for (let i of iframes) {
                    try {
                        const innerDoc = i.contentDocument || i.contentWindow.document;
                        const text = innerDoc.body.innerText;
                        const match = text.match(/\b(\d{4,6})\b/);
                        if (match) {
                            const code = match[1];
                            if (code !== state.code) {
                                state.code = code;
                                document.getElementById('code').textContent = code;
                                log('🔢 验证码: ' + code, 'ok');
                            }
                            return;
                        }
                    } catch (e) {}
                }

                // 备选：直接在页面里找
                const bodyText = doc.body.innerText;
                const match = bodyText.match(/\b(\d{4,6})\b/);
                if (match) {
                    const code = match[1];
                    // 排除常见的非验证码
                    if (!['2024', '2025', '2026', '2027'].includes(code)) {
                        if (code !== state.code) {
                            state.code = code;
                            document.getElementById('code').textContent = code;
                            log('🔢 验证码: ' + code, 'ok');
                        }
                    }
                }
            } catch (e) {}
        }

        // 定时提取
        setInterval(() => {
            extractEmail();
            extractCode();
        }, 1500);

        function onFrameLoad() {
            log('📬 邮箱页面加载完成', 'info');
            // 自动切换域名
            if (!state.domainSwitched) {
                setTimeout(() => switchDomain(), 1000);
            }
        }

        // 调用VPN API
        async function vpnApi(path, method = 'GET', body = null, token = null, imei = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['j-token'] = token;
            if (imei) headers['imei'] = imei;

            const resp = await fetch('/api/vpn/' + path, {
                method: method,
                headers: headers,
                body: body ? JSON.stringify(body) : undefined,
            });
            return resp.json();
        }

        function generateUUID() {
            return '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
            }) + '}';
        }

        // 完整注册流程
        async function startFullFlow() {
            if (state.running) return;
            state.running = true;
            document.getElementById('btn-start').disabled = true;
            setStatus('注册中...', '#FF9F0A');

            try {
                log('=== 开始自动注册 ===', 'run');

                // 确保域名是beeinbox.shop
                if (!state.email || !state.email.endsWith('beeinbox.shop')) {
                    log('⏳ 先确保域名是beeinbox.shop...', 'run');
                    await switchDomain();
                    await new Promise(r => setTimeout(r, 2000));
                }

                // 生成IMEI
                state.imei = generateUUID();
                log('📱 IMEI: ' + state.imei, 'info');

                // device/init
                log('🔄 device/init ...', 'run');
                const initRes = await vpnApi('device/init', 'GET', null, null, state.imei);
                if (initRes.code !== 200) {
                    log('❌ device/init 失败: ' + JSON.stringify(initRes), 'err');
                    return;
                }
                state.deviceToken = initRes.data.user_info.token;
                log('✅ device token 获取成功', 'ok');

                // 等待邮箱
                log('⏳ 等待邮箱...', 'run');
                let wait = 0;
                while (!state.email && wait < 20) {
                    await new Promise(r => setTimeout(r, 1000));
                    wait++;
                }
                if (!state.email) {
                    log('❌ 邮箱创建超时', 'err');
                    return;
                }

                // 检查邮箱后缀
                if (!state.email.endsWith('beeinbox.shop')) {
                    log('⚠️ 邮箱后缀不是beeinbox.shop，可能会失败', 'warn');
                }

                // 发送验证码
                log('📤 发送验证码到 ' + state.email + ' ...', 'run');
                const sendRes = await vpnApi(
                    'user/send_email_code',
                    'POST',
                    { email: state.email, type: 10 },
                    state.deviceToken,
                    state.imei
                );
                if (sendRes.code !== 200) {
                    log('❌ 发送失败: ' + JSON.stringify(sendRes), 'err');
                    return;
                }
                log('✅ 验证码已发送', 'ok');

                // 等待验证码
                log('⏳ 等待验证码...', 'run');
                state.code = '';
                document.getElementById('code').textContent = '----';
                wait = 0;
                while (!state.code && wait < 40) {
                    await new Promise(r => setTimeout(r, 1000));
                    wait++;
                }
                if (!state.code) {
                    log('❌ 等待验证码超时', 'err');
                    return;
                }

                // 注册
                const pwdRaw = Math.random().toString(36).slice(-8) + Math.random().toString(36).slice(-8);
                const pwdMd5 = CryptoJS.MD5(pwdRaw).toString();
                log('📝 注册账号 | 密码: ' + pwdRaw, 'run');

                const signupRes = await vpnApi(
                    'user/signup',
                    'POST',
                    {
                        email: state.email,
                        password: pwdMd5,
                        repassword: pwdMd5,
                        code: state.code,
                    },
                    state.deviceToken,
                    state.imei
                );

                if (signupRes.code === 200) {
                    const free = signupRes.data.user_info.free_remaining_time;
                    const h = Math.floor(free / 3600);
                    const m = Math.floor((free % 3600) / 60);
                    log('✅ 注册成功! 剩余 ' + h + '小时' + m + '分', 'ok');
                    log('🔑 密码: ' + pwdRaw, 'warn');
                    setStatus('✅ 注册成功 | ' + h + 'h' + m + 'm', '#30D158');
                } else {
                    log('❌ 注册失败: ' + signupRes.message, 'err');
                }
            } catch (e) {
                log('❌ 异常: ' + e.message, 'err');
                setStatus('错误', '#FF453A');
            } finally {
                state.running = false;
                document.getElementById('btn-start').disabled = false;
            }
        }
    </script>
</body>
</html>
