<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumperVPN 自动注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1C1C1E;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            color: #8E8E93;
            font-size: 15px;
        }
        .card {
            background: #2C2C2E;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .btn {
            background: #BF5AF2;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { background: #A254D6; }
        .btn:disabled {
            background: #48484A;
            cursor: not-allowed;
        }
        .btn.secondary {
            background: #0A84FF;
        }
        .btn.secondary:hover { background: #0071E3; }
        .email-box {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 15px;
            color: #64D2FF;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .copy-btn {
            background: #48484A;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }
        .copy-btn:hover { background: #5a5a5e; }
        .code-box {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 20px;
            font-family: monospace;
            font-size: 36px;
            font-weight: 700;
            color: #30D158;
            text-align: center;
            letter-spacing: 8px;
        }
        .log {
            background: #1C1C1E;
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.8;
        }
        .log .ok { color: #30D158; }
        .log .err { color: #FF453A; }
        .log .info { color: #8E8E93; }
        .log .run { color: #0A84FF; }
        .log .warn { color: #FF9F0A; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.ready { background: #30D158; color: #000; }
        .status-badge.running { background: #FF9F0A; color: #000; }
        .status-badge.error { background: #FF453A; color: white; }
        .email-item {
            padding: 12px;
            background: #1C1C1E;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .email-item:hover { background: #2a2a2e; }
        .email-subject {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .email-from {
            font-size: 12px;
            color: #8E8E93;
            margin-bottom: 8px;
        }
        .email-body {
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }
        .email-detail {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3a3a3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JumperVPN 自动注册</h1>
            <p>基于 temppin.com 临时邮箱，一键完成注册</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🚀 操作</span>
                <span class="status-badge ready" id="status">就绪</span>
            </div>
            <button class="btn" id="btn-start" onclick="startFullFlow()">
                一键自动注册
            </button>
            <div style="height: 10px;"></div>
            <button class="btn secondary" onclick="createNewEmail()">
                换一个邮箱
            </button>
        </div>

        <div class="card">
            <div class="card-title">📧 临时邮箱</div>
            <div class="email-box">
                <span id="email">点击下方按钮创建</span>
                <button class="copy-btn" onclick="copyEmail()">复制</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>📥 收件箱</span>
                <span id="email-count" style="font-size:12px;color:#8E8E93;">0 封邮件</span>
            </div>
            <div id="emails">
                <div style="color:#8E8E93;text-align:center;padding:20px;font-size:13px;">
                    暂无邮件
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔢 验证码</div>
            <div class="code-box" id="code">------</div>
        </div>

        <div class="card">
            <div class="card-title">📋 运行日志</div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        let state = {
            email: '',
            token: '',
            imei: '',
            deviceToken: '',
            running: false,
            pollTimer: null,
            currentMails: [],
            openedMailId: null,
        };

        function log(msg, type = 'info') {
            const t = new Date().toLocaleTimeString();
            document.getElementById('log').innerHTML +=
                '<div class="' + type + '">[' + t + '] ' + msg + '</div>';
            const logEl = document.getElementById('log');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, type = 'ready') {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status-badge ' + type;
        }

        // 创建新邮箱
        async function createNewEmail() {
            try {
                log('📧 创建新邮箱...', 'run');
                
                const r = await fetch('/api/temppin/create');
                const data = await r.json();
                
                if (data.error) throw new Error(data.error);
                
                const mailbox = data.mailbox;
                state.email = mailbox.address;
                state.token = mailbox.token;
                state.currentMails = [];
                state.openedMailId = null;
                
                document.getElementById('email').textContent = mailbox.address;
                document.getElementById('code').textContent = '------';
                
                log('✅ 邮箱创建成功: ' + mailbox.address, 'ok');
                
                startPolling();
                refreshInbox();
                
                return mailbox;
            } catch (e) {
                log('❌ 创建邮箱失败: ' + e.message, 'err');
                throw e;
            }
        }

        function copyEmail() {
            if (!state.email) return;
            navigator.clipboard.writeText(state.email);
            log('📋 已复制到剪贴板', 'info');
        }

        function startPolling() {
            if (state.pollTimer) clearInterval(state.pollTimer);
            state.pollTimer = setInterval(refreshInbox, 3000);
        }

        async function refreshInbox() {
            if (!state.token) return;
            
            try {
                const r = await fetch('/api/temppin/inbox?token=' + state.token);
                const data = await r.json();
                
                if (data.error) return;
                
                const emails = data.emails || [];
                state.currentMails = emails;
                displayEmails(emails);
            } catch (e) {
                console.log('刷新失败:', e);
            }
        }

        function displayEmails(emails) {
            const container = document.getElementById('emails');
            const countEl = document.getElementById('email-count');
            
            countEl.textContent = emails.length + ' 封邮件';
            
            if (emails.length === 0) {
                container.innerHTML = '<div style="color:#8E8E93;text-align:center;padding:20px;font-size:13px;">暂无邮件</div>';
                return;
            }
            
            let html = '';
            let foundCode = null;
            
            emails.forEach(mail => {
                const fromName = mail.from_name || '';
                const fromAddr = mail.from_address || '';
                const from = (fromName ? fromName + ' ' : '') + (fromAddr ? '<' + fromAddr + '>' : '');
                const subject = mail.subject || '(无主题)';
                const isOpen = state.openedMailId === mail.id;
                
                html += '<div class="email-item" onclick="toggleMail(' + mail.id + ')">';
                html += '<div class="email-subject">' + escapeHtml(subject) + '</div>';
                html += '<div class="email-from">来自: ' + escapeHtml(from) + '</div>';
                
                if (isOpen) {
                    html += '<div class="email-detail" id="detail-' + mail.id + '">加载中...</div>';
                }
                
                html += '</div>';
                
                // 从主题提取验证码
                // 格式: "Your Verification Code - 3359"
                let match = subject.match(/(?:code|verification|验证码)[^\d]*(\d{4,6})/i);
                if (!match) match = subject.match(/\b(\d{4,6})\b/);
                if (match && !foundCode) {
                    foundCode = match[1];
                }
            });
            
            container.innerHTML = html;
            
            if (foundCode && foundCode !== state.code) {
                state.code = foundCode;
                document.getElementById('code').textContent = foundCode;
                log('🔢 收到验证码: ' + foundCode, 'ok');
            }
        }

        async function toggleMail(mailId) {
            if (state.openedMailId === mailId) {
                state.openedMailId = null;
                displayEmails(state.currentMails);
                return;
            }
            
            state.openedMailId = mailId;
            displayEmails(state.currentMails);
            
            try {
                const r = await fetch('/api/temppin/email/' + mailId + '?token=' + state.token);
                const detail = await r.json();
                
                const detailEl = document.getElementById('detail-' + mailId);
                if (detailEl) {
                    const bodyText = detail.text_body || detail.bodyText || detail.body_text || '';
                    const bodyHtml = detail.html_body || detail.bodyHtml || detail.body_html || '';
                    
                    let content = '';
                    if (bodyText) {
                        content = '<div class="email-body">' + escapeHtml(bodyText) + '</div>';
                    } else if (bodyHtml) {
                        content = '<div class="email-body">' + bodyHtml + '</div>';
                    } else {
                        content = '<div class="email-body" style="color:#8E8E93;">无正文内容</div>';
                    }
                    
                    detailEl.innerHTML = content;
                    
                    // 也从正文提取验证码
                    let match = bodyText.match(/\b(\d{4,6})\b/);
                    if (!match) match = bodyHtml.match(/\b(\d{4,6})\b/);
                    if (match && !state.code) {
                        state.code = match[1];
                        document.getElementById('code').textContent = state.code;
                        log('🔢 从正文提取验证码: ' + state.code, 'ok');
                    }
                }
            } catch (e) {
                const detailEl = document.getElementById('detail-' + mailId);
                if (detailEl) detailEl.textContent = '加载失败: ' + e.message;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function vpnApi(path, method = 'GET', body = null, token = null, imei = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['j-token'] = token;
            if (imei) headers['imei'] = imei;

            const r = await fetch('/api/vpn/' + path, {
                method: method,
                headers: headers,
                body: body ? JSON.stringify(body) : undefined,
            });
            return await r.json();
        }

        function generateUUID() {
            return '{' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16).toUpperCase();
            }) + '}';
        }

        async function startFullFlow() {
            if (state.running) return;
            state.running = true;
            
            document.getElementById('btn-start').disabled = true;
            setStatus('运行中', 'running');

            try {
                log('════════════════════════', 'info');
                log('🚀 开始自动注册流程', 'run');

                if (!state.email) {
                    log('\n📌 Step 1: 创建临时邮箱', 'run');
                    await createNewEmail();
                } else {
                    log('\n📌 Step 1: 使用已有邮箱', 'run');
                    log('   ' + state.email, 'info');
                }

                log('\n📌 Step 2: 初始化设备', 'run');
                state.imei = generateUUID();
                log('   IMEI: ' + state.imei, 'info');

                const initRes = await vpnApi('device/init', 'GET', null, null, state.imei);
                if (initRes.code !== 200) {
                    throw new Error('device/init 失败: ' + JSON.stringify(initRes));
                }
                state.deviceToken = initRes.data.user_info.token;
                log('   ✅ 设备初始化成功', 'ok');

                log('\n📌 Step 3: 发送验证码', 'run');
                const sendRes = await vpnApi(
                    'user/send_email_code',
                    'POST',
                    { email: state.email, type: 10 },
                    state.deviceToken,
                    state.imei
                );

                if (sendRes.code !== 200) {
                    throw new Error('发送验证码失败: ' + sendRes.message);
                }
                log('   ✅ 验证码已发送', 'ok');

                log('\n📌 Step 4: 等待接收验证码', 'run');
                state.code = '';
                document.getElementById('code').textContent = '------';
                
                let waited = 0;
                while (!state.code && waited < 120) {
                    await new Promise(r => setTimeout(r, 1000));
                    waited++;
                    if (waited % 15 === 0) {
                        log('   ⏳ 已等待 ' + waited + ' 秒...', 'info');
                    }
                }

                if (!state.code) {
                    throw new Error('等待验证码超时（120秒）');
                }

                log('\n📌 Step 5: 完成注册', 'run');
                
                const pwdRaw = Math.random().toString(36).slice(-8) +
                               Math.random().toString(36).slice(-8);
                const pwdMd5 = CryptoJS.MD5(pwdRaw).toString();
                
                log('   随机密码: ' + pwdRaw, 'info');

                const signupRes = await vpnApi(
                    'user/signup',
                    'POST',
                    {
                        email: state.email,
                        password: pwdMd5,
                        repassword: pwdMd5,
                        code: state.code,
                    },
                    state.deviceToken,
                    state.imei
                );

                if (signupRes.code !== 200) {
                    throw new Error('注册失败: ' + signupRes.message);
                }

                const free = signupRes.data.user_info.free_remaining_time;
                const hours = Math.floor(free / 3600);
                const mins = Math.floor((free % 3600) / 60);

                log('\n════════════════════════', 'ok');
                log('🎉 注册成功！', 'ok');
                log('   邮箱: ' + state.email, 'ok');
                log('   密码: ' + pwdRaw, 'warn');
                log('   免费时长: ' + hours + '小时' + mins + '分', 'ok');
                log('════════════════════════', 'ok');

                setStatus('注册成功', 'ready');

            } catch (e) {
                log('\n❌ 错误: ' + e.message, 'err');
                setStatus('失败', 'error');
            } finally {
                state.running = false;
                document.getElementById('btn-start').disabled = false;
            }
        }

        window.onload = function() {
            log('👋 欢迎使用 JumperVPN 自动注册工具', 'info');
            log('正在自动创建邮箱...', 'info');
            createNewEmail();
        };
    </script>
</body>
</html>
